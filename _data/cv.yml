cv:
  name: Dominik Bittner
  label: PhD Researcher, Environmental Sustainability
  email: dominikbittner2023@gmail.com
  summary: >
    My bond with nature began at an early age, growing up on a farm with its woodlands. I have witnessed firsthand the
    challenges faced by farmers due to deteriorating soil health, leading to a strong motivation to advance sustainable
    agricultural practices. Fully in line with UN Sustainable Development Goals, I am particularly invested in helping
    regions where support is urgently needed, such as in sub-Saharan Africa, where farmers heavily depend on the
    health of their soils.

